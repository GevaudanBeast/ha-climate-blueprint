blueprint:
  name: "HVAC – X4FP Salle de bain (Lumière + SO compatible) v7.19"
  description: "NEW v7.19: planning avec calendriers HA (événement = ON autorise lumière, pas d'événement = OFF bloque lumière). Planning horaire avec 1 calendar HA: si événement actif autorise système lumière, si pas d'événement force ECO et désactive système lumière. Sèche-serviettes avec Solar Optimizer prioritaire. Surveille attribut is_active du switch SO (fallback sur state pour switch classique). Fix v7.16: détection lumière et Solar Optimizer robustes (ajout .lower()). ORDRE: Été > Fenêtre > SO ACTIF > Away > Planning OFF (bloque lumière) > Lumière (si planning ON ou pas de planning)."
  domain: automation
  author: LaCaseHome

  input:
    room_name:
      name: Nom logique de la pièce
      default: "Pièce"

    climate_entity:
      name: Entité climate (X4FP – fil pilote)
      selector: { entity: { domain: climate } }

    comfort_light:
      name: Lumière de la pièce (obligatoire)
      selector: { entity: { domain: light } }

    light_on_behavior:
      name: "Quand la lumière est ON"
      default: "force_comfort"
      selector:
        select:
          options:
            - { label: "Forcer comfort", value: "force_comfort" }
            - { label: "Forcer eco", value: "force_eco" }
            - { label: "Toggle eco↔️comfort", value: "toggle_on" }
            - { label: "Aucun", value: "none" }

    light_off_behavior:
      name: "Quand la lumière est OFF"
      default: "force_eco"
      selector:
        select:
          options:
            - { label: "Forcer eco", value: "force_eco" }
            - { label: "Forcer comfort", value: "force_comfort" }
            - { label: "Aucun", value: "none" }

    # -------- Fenêtres (OPTIONNEL) --------
    window_sensors:
      name: Capteurs fenêtre(s)/porte(s) (peut être vide)
      default: []
      selector: { entity: { domain: binary_sensor, multiple: true } }

    delay_open_min:
      name: "Délai avant PAUSE (min) après ouverture"
      default: 2
      selector: { number: { min: 0, max: 60, step: 1 } }

    delay_close_min:
      name: "Délai avant REPRISE (min) après fermeture"
      default: 2
      selector: { number: { min: 0, max: 60, step: 1 } }

    # -------- Été / Away (OPTIONNELS) --------
    summer_entity:
      name: Indicateur Été (on/off) – ON = Été
      default: ""
      selector: { entity: {} }

    summer_policy:
      name: Politique en Été
      default: "off"
      selector:
        select:
          options:
            - label: "OFF (thermostat arrêté)"
              value: "off"
            - label: "ECO (laisser en éco)"
              value: "eco"

    alarm_entity:
      name: Alarme (Alarmo) – Away si armed_*
      default: ""
      selector: { entity: { domain: alarm_control_panel } }

    # -------- Planning horaire (OPTIONNEL - remplace lumière si alarme désarmée) --------
    schedule_entity:
      name: "📅 Planning Horaire (optionnel)"
      description: "Calendar Home Assistant. Événement actif = autorise lumière, pas d'événement = bloque lumière (force ECO). Actif uniquement si alarme désarmée."
      default: ""
      selector: { entity: { domain: calendar } }

    preset_schedule_on:
      name: "Preset quand Planning ACTIF (événement en cours)"
      description: "Autorise le système lumière (ce preset n'est pas directement appliqué)"
      default: comfort
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_schedule_off:
      name: "Preset quand Planning INACTIF (pas d'événement)"
      description: "Force ce preset et bloque le système lumière"
      default: eco
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    # -------- SOLAIRE (OPTIONNEL) --------
    solar_switch:
      name: "Solar Optimizer – SWITCH D'ACTION (ex: switch.solar_optimizer_seche_serviette_xxx)"
      description: "Le switch que SO contrôle. Le blueprint vérifie l'attribut 'is_active' (ou l'état si switch classique). Laisser vide si pas de SO."
      default: ""
      selector:
        entity:
          domain: switch

    allow_solar_in_away:
      name: "Autoriser SO à chauffer en mode Away"
      description: "Si activé, SO peut forcer COMFORT même quand alarme armée"
      default: false
      selector:
        boolean: {}

    solar_preset:
      name: "Preset quand SO chauffe"
      description: "Quel preset appliquer quand SO est actif (ON)"
      default: "comfort"
      selector:
        select:
          options: [eco, comfort, comfort-1, comfort-2, away, boost, none]

    # -------- Presets --------
    preset_heat:
      name: Preset "confort"
      default: comfort
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_idle:
      name: Preset "éco"
      default: eco
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_window:
      name: Preset quand fenêtre ouverte
      default: away
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_away:
      name: Preset en Away (si pas de solaire)
      default: away
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    # -------- Tick paramétrable --------
    tick_minutes:
      name: "Fréquence de ré-application (min) – 0 pour désactiver"
      default: 10
      selector: { number: { min: 0, max: 120, step: 1 } }

mode: restart
max_exceeded: silent

trigger:
  # Lumière (OBLIGATOIRE)
  - id: light_on
    platform: state
    entity_id: !input comfort_light
    to: "on"

  - id: light_off
    platform: state
    entity_id: !input comfort_light
    to: "off"

  # Fenêtres via STATE
  - id: win_open
    platform: state
    entity_id: !input window_sensors
    to: "on"
    for: { minutes: !input delay_open_min }

  - id: win_close
    platform: state
    entity_id: !input window_sensors
    to: "off"
    for: { minutes: !input delay_close_min }

  # Alarme (trigger si configurée)
  - id: alarm_change
    platform: template
    value_template: >-
      {{ states(alarm_id) if alarm_id and alarm_id != '' else 'none' }}

  # Planning horaire (trigger si configuré)
  - id: schedule_change
    platform: template
    value_template: >-
      {{ states(schedule_id) if schedule_id and schedule_id != '' else 'none' }}

  # Été (trigger si configuré)
  - id: summer_change
    platform: template
    value_template: >-
      {{ states(summer_id) if summer_id and summer_id != '' else 'none' }}

  # Solar Optimizer switch (trigger si configuré)
  - id: solar_change
    platform: template
    value_template: >-
      {% if solar_switch_id != '' %}
        {% set active_attr = state_attr(solar_switch_id, 'is_active') %}
        {{ (active_attr == true) if (active_attr != None) else (states(solar_switch_id) | lower == 'on') }}
      {% else %}
        false
      {% endif %}

  # Tick périodique (optimisé)
  - id: periodic
    platform: template
    value_template: >-
      {% if tick_minutes is defined %}
        {% set m = tick_minutes | int(0) %}
        {% if m > 0 %}
          {{ now().minute % m == 0 and now().second < 5 }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}

variables:
  room: !input room_name
  climate: !input climate_entity

  window_sensors_list: !input window_sensors

  light_id: !input comfort_light
  light_on_behavior: !input light_on_behavior
  light_off_behavior: !input light_off_behavior

  summer_id: !input summer_entity
  summer_policy: !input summer_policy
  alarm_id: !input alarm_entity

  solar_switch_id: !input solar_switch
  allow_solar_in_away: !input allow_solar_in_away
  solar_preset: !input solar_preset

  preset_heat: !input preset_heat
  preset_idle: !input preset_idle
  preset_window: !input preset_window
  preset_away: !input preset_away

  tick_minutes: !input tick_minutes

  # Planning horaire
  schedule_id: !input schedule_entity
  preset_sched_on: !input preset_schedule_on
  preset_sched_off: !input preset_schedule_off

  is_summer: >-
    {% if summer_id and summer_id != '' %}
      {% set st = states(summer_id) | lower %}
      {{ st in ['on','true','open'] }}
    {% else %}
      false
    {% endif %}
  is_away: >-
    {% if alarm_id and alarm_id != '' %}
      {% set st = states(alarm_id) | lower %}
      {{ st.startswith('armed') }}
    {% else %} false {% endif %}

  # ⭐ Logique SO - Surveille le switch d'action (is_active pour SO, state pour switch classique)
  solar_is_heating: >-
    {% if solar_switch_id != '' %}
      {% set active_attr = state_attr(solar_switch_id, 'is_active') %}
      {{ (active_attr == true) if (active_attr != None) else (states(solar_switch_id) | lower == 'on') }}
    {% else %}
      false
    {% endif %}
  solar_can_override_away: "{{ allow_solar_in_away and solar_is_heating }}"

  win_any_open: >-
    {{ expand(window_sensors_list) | selectattr('state','eq','on') | list | count > 0 }}

condition: []

action:

  # 0) Variables runtime
  - variables:
      is_light_on: "{{ states(light_id) | lower == 'on' }}"
      current_preset: "{{ state_attr(climate,'preset_mode') or '' }}"
      current_mode: "{{ states(climate) }}"

  # 1) ÉTÉ
  - choose:
      - conditions: "{{ is_summer and summer_policy == 'off' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_mode != 'off' }}"
            then:
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ climate }}" }
                data: { hvac_mode: "off" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "☀️ Été → OFF"
          - stop: "Été OFF"

      - conditions: "{{ is_summer and summer_policy == 'eco' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_idle }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_idle }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "☀️ Été → ECO"
          - stop: "Été ECO"

  # 2) FENÊTRE ouverte (pause)
  - choose:
      - conditions: "{{ win_any_open }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_window }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_window }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "🪟 Fenêtre ouverte → PAUSE ({{ preset_window }})"
          - stop: "Pause fenêtre"

  # ⭐ 3) SOLAIRE ACTIF (switch.solar_optimizer_xxx = ON) - PRIORITÉ (si autorisé en Away)
  - choose:
      - conditions: "{{ not is_light_on and trigger.id != 'light_off' and solar_is_heating and solar_preset != 'none' and (not is_away or allow_solar_in_away) }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != solar_preset }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ solar_preset }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "⚡ SO ACTIF ({{ solar_switch_id }}) → {{ solar_preset|upper }}"
          - stop: "SO chauffe activement"

      - conditions: "{{ not is_light_on and trigger.id != 'light_off' and solar_is_heating and solar_preset == 'none' and (not is_away or allow_solar_in_away) }}"
        sequence:
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "⚡ SO ACTIF → Blueprint en retrait (preset none)"
          - stop: "SO chauffe (mode passif)"

  # 4) AWAY (seulement si SO ne chauffe pas OU si allow_solar_in_away = false)
  - choose:
      - conditions: "{{ is_away and not solar_can_override_away }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_away }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_away }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "🔒 Away → {{ preset_away|upper }}"
          - stop: "Away appliqué"

  # 5) PLANNING HORAIRE – autorise ou bloque le système de gestion par lumière
  - choose:
      - conditions: "{{ not is_away }}"
        sequence:
          - variables:
              schedule_preset: >-
                {% if schedule_id and schedule_id != '' %}
                  {% set sched_state = states(schedule_id) | lower %}
                  {% if sched_state and sched_state not in ['off', 'unavailable', 'unknown', ''] %}
                    {{ preset_sched_on }}
                  {% else %}
                    {{ preset_sched_off }}
                  {% endif %}
                {% else %}
                  none
                {% endif %}
          - choose:
              # Planning OFF → Force ECO et bloque le système lumière
              - conditions: "{{ schedule_preset != 'none' and schedule_preset == preset_sched_off and current_preset != schedule_preset }}"
                sequence:
                  - service: climate.set_preset_mode
                    target: { entity_id: "{{ climate }}" }
                    data: { preset_mode: "{{ schedule_preset }}" }
                  - service: logbook.log
                    data:
                      name: "{{ room }}"
                      message: "📅 Planning OFF → {{ schedule_preset|upper }} (désactive lumière)"
                  - stop: "Planning OFF : système lumière désactivé"
              # Planning ON → Continue vers lumière (autorise le système lumière)

  # 6) LUMIÈRE – gestion continue (applique selon l'état actuel) - Si non Away ET (planning ON OU pas de planning)
  - choose:
      # ============ ON behaviors ============
      - conditions: "{{ not is_away and is_light_on and light_on_behavior == 'force_comfort' and current_preset != preset_heat }}"
        sequence:
          - service: climate.set_preset_mode
            target: { entity_id: "{{ climate }}" }
            data: { preset_mode: "{{ preset_heat }}" }
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "💡 ON → COMFORT ({{ preset_heat }})"

      - conditions: "{{ not is_away and is_light_on and light_on_behavior == 'force_eco' and current_preset != preset_idle }}"
        sequence:
          - service: climate.set_preset_mode
            target: { entity_id: "{{ climate }}" }
            data: { preset_mode: "{{ preset_idle }}" }
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "💡 ON → ECO ({{ preset_idle }})"

      - conditions: "{{ not is_away and trigger.id == 'light_on' and light_on_behavior == 'toggle_on' }}"
        sequence:
          - choose:
              - conditions: "{{ current_preset == preset_idle }}"
                sequence:
                  - service: climate.set_preset_mode
                    target: { entity_id: "{{ climate }}" }
                    data: { preset_mode: "{{ preset_heat }}" }
                  - service: logbook.log
                    data:
                      name: "{{ room }}"
                      message: "💡 ON (toggle) → COMFORT ({{ preset_heat }})"
              - conditions: "{{ current_preset == preset_heat }}"
                sequence:
                  - service: climate.set_preset_mode
                    target: { entity_id: "{{ climate }}" }
                    data: { preset_mode: "{{ preset_idle }}" }
                  - service: logbook.log
                    data:
                      name: "{{ room }}"
                      message: "💡 ON (toggle) → ECO ({{ preset_idle }})"

      # ============ OFF behaviors ============
      - conditions: "{{ not is_away and (not is_light_on) and light_off_behavior == 'force_eco' and current_preset != preset_idle }}"
        sequence:
          - service: climate.set_preset_mode
            target: { entity_id: "{{ climate }}" }
            data: { preset_mode: "{{ preset_idle }}" }
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "💡 OFF → ECO ({{ preset_idle }})"

      - conditions: "{{ not is_away and (not is_light_on) and light_off_behavior == 'force_comfort' and current_preset != preset_heat }}"
        sequence:
          - service: climate.set_preset_mode
            target: { entity_id: "{{ climate }}" }
            data: { preset_mode: "{{ preset_heat }}" }
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "💡 OFF → COMFORT ({{ preset_heat }})"

  # ✅ Si on arrive ici sans action = OK, on ne force rien
