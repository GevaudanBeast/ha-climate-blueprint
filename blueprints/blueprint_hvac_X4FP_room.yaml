blueprint:
  name: "HVAC – X4FP (Thermique + SO compatible) v7.13"
  description: "X4FP avec Solar Optimizer prioritaire. Surveille attribut is_active du switch SO (fallback sur state pour switch classique). Fix v7.13: détection Solar Optimizer robuste (ajout .lower()). Fix v7.12: détection été robuste (ajout .lower()). Fix v7.11: triggers alarme/été fiables (retour string vs booléen). ORDRE: Été > Fenêtre > SO ACTIF (si jour + autorisé en Away) > Away > Thermique (si non Away + capteur valide)."
  domain: automation
  author: LaCaseHome

  input:
    room_name:
      name: Nom logique de la pièce
      default: "Pièce"

    climate_entity:
      name: Entité climate (X4FP – fil pilote)
      selector: { entity: { domain: climate } }

    # -------- Thermique (OPTIONNEL) --------
    room_temp_sensor:
      name: Capteur de température (°C) – optionnel
      default: ""
      selector: { entity: { domain: sensor } }

    setpoint_number:
      name: Consigne (input_number.* en °C) – optionnel
      default: ""
      selector: { entity: { domain: input_number } }

    hysteresis_c:
      name: "Hystérésis (°C)"
      default: 0.5
      selector: { number: { min: 0.2, max: 2.0, step: 0.1 } }

    min_allowed_c:
      name: "Garde-fou: consigne mini (°C)"
      default: 17
      selector: { number: { min: 5, max: 25, step: 0.5 } }

    max_allowed_c:
      name: "Garde-fou: consigne maxi (°C)"
      default: 23
      selector: { number: { min: 15, max: 28, step: 0.5 } }

    # -------- Fenêtres (OPTIONNEL) --------
    window_sensors:
      name: Capteurs fenêtre(s)/porte(s) (peut être vide)
      default: []
      selector: { entity: { domain: binary_sensor, multiple: true } }

    delay_open_min:
      name: "Délai avant PAUSE (min) après ouverture"
      default: 2
      selector: { number: { min: 0, max: 60, step: 1 } }

    delay_close_min:
      name: "Délai avant REPRISE (min) après fermeture"
      default: 2
      selector: { number: { min: 0, max: 60, step: 1 } }

    # -------- Été / Away (OPTIONNELS) --------
    summer_entity:
      name: Indicateur Été (on/off) – ON = Été
      default: ""
      selector: { entity: {} }

    summer_policy:
      name: Politique en Été
      default: "off"
      selector:
        select:
          options:
            - label: "OFF (thermostat arrêté)"
              value: "off"
            - label: "ECO (laisser en éco)"
              value: "eco"

    alarm_entity:
      name: Alarme (Alarmo) – Away si armed_*
      default: ""
      selector: { entity: { domain: alarm_control_panel } }

    # -------- SOLAIRE (OPTIONNEL) --------
    solar_switch:
      name: "Solar Optimizer – SWITCH D'ACTION (ex: switch.solar_optimizer_chauffage_suite_parentale)"
      description: "Le switch que SO contrôle. Le blueprint vérifie l'attribut 'is_active' (ou l'état si switch classique). Laisser vide si pas de SO."
      default: ""
      selector:
        entity:
          domain: switch

    allow_solar_in_away:
      name: "Autoriser SO à chauffer en mode Away"
      description: "Si activé, SO peut forcer COMFORT même quand alarme armée"
      default: false
      selector:
        boolean: {}

    solar_preset:
      name: "Preset quand SO chauffe"
      description: "Quel preset appliquer quand SO est actif (ON)"
      default: "comfort"
      selector:
        select:
          options: [eco, comfort, comfort-1, comfort-2, away, boost, none]

    # -------- Presets --------
    preset_heat:
      name: Preset quand on chauffe (demande)
      default: comfort
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_idle:
      name: Preset quand on n'a plus besoin de chauffer
      default: eco
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_window:
      name: Preset quand fenêtre ouverte
      default: away
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    preset_away:
      name: Preset en Away (si pas de solaire)
      default: away
      selector: { select: { options: [eco, comfort, comfort-1, comfort-2, away, boost] } }

    # -------- Tick paramétrable --------
    tick_minutes:
      name: "Fréquence de ré-application (min) – 0 pour désactiver"
      default: 10
      selector: { number: { min: 0, max: 120, step: 1 } }

mode: restart
max_exceeded: silent

trigger:
  # Fenêtres (liste optionnelle) via STATE
  - id: win_open
    platform: state
    entity_id: !input window_sensors
    to: "on"
    for: { minutes: !input delay_open_min }

  - id: win_close
    platform: state
    entity_id: !input window_sensors
    to: "off"
    for: { minutes: !input delay_close_min }

  # Température (trigger si configurée) - RÉACTIVITÉ IMMÉDIATE
  - id: temp_change
    platform: state
    entity_id: !input room_temp_sensor

  # Consigne (trigger si configurée) - RÉACTIVITÉ IMMÉDIATE
  - id: setpoint_change
    platform: state
    entity_id: !input setpoint_number

  # Alarme (trigger si configurée)
  - id: alarm_change
    platform: template
    value_template: >-
      {{ states(alarm_id) if alarm_id and alarm_id != '' else 'none' }}

  # Été (trigger si configuré)
  - id: summer_change
    platform: template
    value_template: >-
      {{ states(summer_id) if summer_id and summer_id != '' else 'none' }}

  # Solar Optimizer switch (trigger si configuré)
  - id: solar_change
    platform: template
    value_template: >-
      {% if solar_switch_id != '' %}
        {% set active_attr = state_attr(solar_switch_id, 'is_active') %}
        {{ (active_attr == true) if (active_attr != None) else (states(solar_switch_id) | lower == 'on') }}
      {% else %}
        false
      {% endif %}

  # Lever/coucher du soleil (pour limiter SO au jour)
  - id: sun_change
    platform: state
    entity_id: sun.sun

  # Tick périodique (optimisé)
  - id: periodic
    platform: template
    value_template: >-
      {% if tick_minutes is defined %}
        {% set m = tick_minutes | int(0) %}
        {% if m > 0 %}
          {{ now().minute % m == 0 and now().second < 5 }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}

variables:
  room: !input room_name
  climate: !input climate_entity

  window_sensors_list: !input window_sensors

  temp_id: !input room_temp_sensor
  sp_id: !input setpoint_number
  hys: !input hysteresis_c
  sp_min: !input min_allowed_c
  sp_max: !input max_allowed_c

  summer_id: !input summer_entity
  summer_policy: !input summer_policy
  alarm_id: !input alarm_entity

  solar_switch_id: !input solar_switch
  allow_solar_in_away: !input allow_solar_in_away
  solar_preset: !input solar_preset

  preset_heat: !input preset_heat
  preset_idle: !input preset_idle
  preset_window: !input preset_window
  preset_away: !input preset_away

  tick_minutes: !input tick_minutes

  # Valeurs température (avec validation)
  temp_state: >-
    {% if temp_id and temp_id != '' %}
      {{ states(temp_id) }}
    {% else %}
      {{ 'unknown' }}
    {% endif %}

  temp_valid: >-
    {{ temp_state not in ['unavailable', 'unknown', 'none', ''] }}

  t_room: >-
    {% if temp_valid %}
      {{ temp_state | float(0) }}
    {% else %}
      {{ 0.0 }}
    {% endif %}

  sp_raw: >-
    {% if sp_id and sp_id != '' %}
      {{ states(sp_id) | float(0) }}
    {% else %}
      {{ 0.0 }}
    {% endif %}

  # Clamp consigne
  sp: "{{ [[sp_raw, sp_max] | min, sp_min] | max }}"

  # Été / Away / Solaire
  is_summer: >-
    {% if summer_id and summer_id != '' %}
      {% set st = states(summer_id) | lower %}
      {{ st in ['on','true','open'] }}
    {% else %}
      false
    {% endif %}
  is_away: >-
    {% if alarm_id and alarm_id != '' %}
      {% set st = states(alarm_id) | lower %}
      {{ st.startswith('armed') }}
    {% else %} false {% endif %}

  # Détection jour/nuit (pour limiter SO au jour uniquement)
  is_daytime: "{{ is_state('sun.sun', 'above_horizon') }}"

  # ⭐ Logique SO - Surveille le switch d'action (is_active pour SO, state pour switch classique)
  solar_is_heating: >-
    {% if solar_switch_id != '' %}
      {% set active_attr = state_attr(solar_switch_id, 'is_active') %}
      {{ (active_attr == true) if (active_attr != None) else (states(solar_switch_id) | lower == 'on') }}
    {% else %}
      false
    {% endif %}
  solar_can_override_away: "{{ allow_solar_in_away and solar_is_heating }}"

  # Fenêtres
  win_any_open: >-
    {{ expand(window_sensors_list) | selectattr('state','eq','on') | list | count > 0 }}

  # Config thermique (nécessite capteur VALIDE)
  has_thermal: "{{ temp_id != '' and sp_id != '' and temp_valid }}"

condition: []

action:

  # 0) Validation config
  - variables:
      current_preset: "{{ state_attr(climate,'preset_mode') or '' }}"
      current_mode: "{{ states(climate) }}"

  # 1) ÉTÉ (priorité absolue)
  - choose:
      - conditions: "{{ is_summer and summer_policy == 'off' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_mode != 'off' }}"
            then:
              - service: climate.set_hvac_mode
                target: { entity_id: "{{ climate }}" }
                data: { hvac_mode: "off" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "☀️ Été → OFF"
          - stop: "Été OFF"

      - conditions: "{{ is_summer and summer_policy == 'eco' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_idle }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_idle }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "☀️ Été → ECO"
          - stop: "Été ECO"

  # 2) FENÊTRE ouverte (pause) – prioritaire même sur SO
  - choose:
      - conditions: "{{ win_any_open }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_window }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_window }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "🪟 Fenêtre ouverte → PAUSE ({{ preset_window }})"
          - stop: "Pause fenêtre"

  # ⭐ 3) SOLAIRE ACTIF (switch.solar_optimizer_xxx = ON) - PRIORITÉ (si autorisé en Away)
  - choose:
      - conditions: "{{ is_daytime and solar_is_heating and solar_preset != 'none' and (not is_away or allow_solar_in_away) }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != solar_preset }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ solar_preset }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "⚡ SO ACTIF ({{ solar_switch_id }}) → {{ solar_preset|upper }}"
          - stop: "SO chauffe activement"

      - conditions: "{{ is_daytime and solar_is_heating and solar_preset == 'none' and (not is_away or allow_solar_in_away) }}"
        sequence:
          - service: logbook.log
            data:
              name: "{{ room }}"
              message: "⚡ SO ACTIF → Blueprint en retrait (preset none)"
          - stop: "SO chauffe (mode passif)"

  # 4) AWAY (seulement si SO ne chauffe pas OU si allow_solar_in_away = false)
  - choose:
      - conditions: "{{ is_away and not solar_can_override_away }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_preset != preset_away }}"
            then:
              - service: climate.set_preset_mode
                target: { entity_id: "{{ climate }}" }
                data: { preset_mode: "{{ preset_away }}" }
              - service: logbook.log
                data:
                  name: "{{ room }}"
                  message: "🔒 Away → {{ preset_away|upper }}"
          - stop: "Away appliqué"

  # 5) THERMIQUE (hystérésis) – SEULEMENT si capteur + consigne configurés ET non Away
  - choose:
      - conditions: "{{ not is_away and has_thermal }}"
        sequence:
          - variables:
              need_heat: "{{ t_room <= (sp - hys) }}"
              need_idle: "{{ t_room >= (sp + hys) }}"

          - choose:
              - conditions: "{{ need_heat }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ current_preset != preset_heat }}"
                    then:
                      - service: climate.set_preset_mode
                        target: { entity_id: "{{ climate }}" }
                        data: { preset_mode: "{{ preset_heat }}" }
                      - service: logbook.log
                        data:
                          name: "{{ room }}"
                          message: "🌡️ T° {{ t_room }}°C ≤ {{ sp - hys }}°C → HEAT"

              - conditions: "{{ need_idle }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ current_preset != preset_idle }}"
                    then:
                      - service: climate.set_preset_mode
                        target: { entity_id: "{{ climate }}" }
                        data: { preset_mode: "{{ preset_idle }}" }
                      - service: logbook.log
                        data:
                          name: "{{ room }}"
                          message: "🌡️ T° {{ t_room }}°C ≥ {{ sp + hys }}°C → IDLE"

  # ✅ Si on arrive ici sans action = OK, on ne force rien